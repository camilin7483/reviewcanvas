services:
  - name: reviewcanvas-api
    type: web
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SERVE_FRONTEND
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_POOL_MAX
        value: "3"
      - key: NODE_OPTIONS
        value: --max-old-space-size=256
      - key: UV_THREADPOOL_SIZE
        value: "2"
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: API_PROXY_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: reviewcanvas-private
